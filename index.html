<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>여행 일정 지도</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --bg:#fff; --fg:#222; --muted:#888; --line:#e5e5e5; --accent:#ff5a5f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181c; --fg:#eee; --muted:#999; --line:#333; } }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--fg); display:flex; flex-direction:column; height:100dvh; }
  header { padding:10px 16px; display:flex; gap:8px; align-items:center; border-bottom:1px solid var(--line); }
  header input { flex:1; font-size:17px; font-weight:600; border:0; background:none; color:inherit; min-width:0; }
  button { font:inherit; border:1px solid var(--line); background:var(--bg); color:inherit; border-radius:8px; padding:6px 10px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  #map { flex:1; min-height:40vh; }
  #panel { height:45vh; overflow:auto; padding:0 16px 16px; }
  #days { display:flex; gap:6px; overflow-x:auto; padding:10px 0; position:sticky; top:0; background:var(--bg); z-index:1; }
  #days button.on { background:var(--fg); color:var(--bg); }
  form { display:flex; gap:6px; margin-bottom:8px; }
  form input { flex:1; padding:8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:inherit; font:inherit; min-width:0; }
  ul { list-style:none; padding:0; margin:0; }
  li { display:flex; gap:8px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
  li .n { width:24px; height:24px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; font-size:13px; flex:none; }
  li .t { flex:1; min-width:0; }
  li .t small { display:block; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  li button { padding:2px 8px; }
  #results li { cursor:pointer; }
  .pin { background:var(--accent); color:#fff; border-radius:50%; width:26px; height:26px; display:grid; place-items:center; font:600 13px system-ui; border:2px solid #fff; box-shadow:0 1px 4px #0006; }
  .muted { color:var(--muted); font-size:14px; }
  @media (min-width:800px) { body { flex-direction:row; flex-wrap:wrap; } header { width:100%; } #panel { width:380px; height:auto; flex:none; order:-1; } #map { height:auto; } }
</style>
</head>
<body>
<header>
  <input id="title" aria-label="여행 이름">
  <button id="addDay">+ 일차</button>
  <button id="share" class="primary">공유</button>
</header>
<div id="panel">
  <div id="days"></div>
  <div id="dayHead" class="muted"></div>
  <form id="search"><input id="q" placeholder="장소 검색 (예: 성산일출봉)" aria-label="장소 검색"><button>검색</button></form>
  <ul id="results"></ul>
  <ul id="places"></ul>
</div>
<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const COLORS = ['#ff5a5f','#2b8aef','#21a366','#f59f00','#845ef7','#e64980','#15aabf'];
const $ = id => document.getElementById(id);

// Trip data lives in the URL hash so a shared link carries the whole plan (no server).
const enc = o => btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec = s => JSON.parse(decodeURIComponent(escape(atob(s))));

function load() {
  if (location.hash.length > 1) {
    try { return dec(location.hash.slice(1)); } catch { alert('공유 링크를 읽을 수 없어요.'); }
  }
  try { const s = localStorage.getItem('trip'); if (s) return JSON.parse(s); } catch {}
  return { title: '나의 여행', start: new Date().toISOString().slice(0,10), days: [[]] };
}
let trip = load(), cur = 0;

function save() {
  try { localStorage.setItem('trip', JSON.stringify(trip)); } catch {}
  history.replaceState(null, '', '#' + enc(trip));
}

const map = L.map('map').setView([37.5665, 126.978], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
const layer = L.layerGroup().addTo(map);

function dayLabel(i) {
  const d = new Date(trip.start); d.setDate(d.getDate() + i);
  return `${i+1}일차 · ${d.getMonth()+1}/${d.getDate()}`;
}

function render() {
  $('title').value = trip.title;
  $('days').innerHTML = '';
  trip.days.forEach((_, i) => {
    const b = document.createElement('button');
    b.textContent = dayLabel(i); b.className = i === cur ? 'on' : '';
    b.style.borderColor = COLORS[i % COLORS.length];
    b.onclick = () => { cur = i; render(); };
    $('days').append(b);
  });
  $('dayHead').innerHTML = `출발일 <input type="date" id="start" value="${trip.start}"> ` +
    (trip.days.length > 1 ? '<button id="delDay">이 일차 삭제</button>' : '');
  $('start').onchange = e => { trip.start = e.target.value; save(); render(); };
  if ($('delDay')) $('delDay').onclick = () => {
    if (!confirm(`${cur+1}일차 일정을 삭제할까요?`)) return;
    trip.days.splice(cur, 1); cur = Math.max(0, cur - 1); save(); render();
  };

  const list = trip.days[cur];
  $('places').innerHTML = list.length ? '' : '<li class="muted">장소를 검색해서 추가하세요.</li>';
  list.forEach((p, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n" style="background:${COLORS[cur % COLORS.length]}">${i+1}</span>
      <span class="t">${esc(p.name)}<small>${esc(p.addr || '')}</small></span>
      <button aria-label="위로">↑</button><button aria-label="아래로">↓</button><button aria-label="삭제">✕</button>`;
    const [up, down, del] = li.querySelectorAll('button');
    up.onclick = () => move(i, -1); down.onclick = () => move(i, 1);
    del.onclick = () => { list.splice(i, 1); save(); render(); };
    li.querySelector('.t').onclick = () => map.setView([p.lat, p.lng], 15);
    $('places').append(li);
  });
  drawMap();
}

function move(i, d) {
  const l = trip.days[cur], j = i + d;
  if (j < 0 || j >= l.length) return;
  [l[i], l[j]] = [l[j], l[i]]; save(); render();
}

function drawMap() {
  layer.clearLayers();
  const pts = trip.days[cur].map(p => [p.lat, p.lng]);
  const color = COLORS[cur % COLORS.length];
  trip.days[cur].forEach((p, i) => L.marker([p.lat, p.lng], {
    icon: L.divIcon({ className: '', html: `<div class="pin" style="background:${color}">${i+1}</div>`, iconSize: [26,26], iconAnchor: [13,13] })
  }).bindPopup(esc(p.name)).addTo(layer));
  if (pts.length > 1) L.polyline(pts, { color, weight: 4, dashArray: '6 6' }).addTo(layer);
  if (pts.length) map.fitBounds(pts, { padding: [40,40], maxZoom: 15 });
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

$('search').onsubmit = async e => {
  e.preventDefault();
  const q = $('q').value.trim(); if (!q) return;
  $('results').innerHTML = '<li class="muted">검색 중…</li>';
  try {
    // shortcut: free OpenStreetMap search (1 req/sec, weaker on small Korean shops); swap for Kakao/Google Places API if it gets real traffic.
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=6&accept-language=ko&q=${encodeURIComponent(q)}`);
    const data = await r.json();
    $('results').innerHTML = data.length ? '' : '<li class="muted">결과가 없어요.</li>';
    data.forEach(d => {
      const li = document.createElement('li');
      const name = d.name || d.display_name.split(',')[0];
      li.innerHTML = `<span class="t">${esc(name)}<small>${esc(d.display_name)}</small></span><button>추가</button>`;
      li.onclick = () => {
        trip.days[cur].push({ name, addr: d.display_name, lat: +d.lat, lng: +d.lon });
        $('results').innerHTML = ''; $('q').value = ''; save(); render();
      };
      $('results').append(li);
    });
  } catch { $('results').innerHTML = '<li class="muted">검색에 실패했어요. 잠시 후 다시 해 주세요.</li>'; }
};

$('title').oninput = e => { trip.title = e.target.value; save(); };
$('addDay').onclick = () => { trip.days.push([]); cur = trip.days.length - 1; save(); render(); };
$('share').onclick = async () => {
  save();
  const url = location.href;
  if (navigator.share) { try { await navigator.share({ title: trip.title, url }); return; } catch {} }
  try { await navigator.clipboard.writeText(url); alert('링크를 복사했어요. 친구에게 보내 주세요!'); }
  catch { prompt('이 링크를 복사해서 보내 주세요', url); }
};

// self-check: share encoding must round-trip Korean text
console.assert(dec(enc({ t: '제주 여행 ✈' })).t === '제주 여행 ✈', 'share encoding broken');
save(); render();
</script>
</body>
</html>
